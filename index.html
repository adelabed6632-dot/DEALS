<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رادار الصفقات الكبرى | عروض مصر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; }
    
    header { background: #111827; padding: 22px 15px; text-align: center; border-bottom: 1px solid #1f2937; }
    header h1 { font-size: 26px; font-weight: 900; }
    header h1 span { color: #ef4444; }
    .badge-live { display: inline-block; margin-top: 8px; background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid #22c55e; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }

    .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }

    /* شريط الأقسام */
    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 25px; scrollbar-width: thin; }
    .cat-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 9px 18px; border-radius: 25px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-btn:hover { background: #334155; color: #fff; }
    .cat-btn.active { background: #ef4444; color: #fff; border-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }

    /* شبكة العروض */
    .deals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-5px); border-color: #ef4444; }
    
    .discount-tag { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 6px; }
    .store-tag { position: absolute; top: 10px; left: 10px; background: #1e293b; color: #38bdf8; font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 6px; border: 1px solid #334155; }
    .card img { width: 100%; height: 190px; object-fit: contain; background: #ffffff; padding: 10px; }
    .card-body { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 14px; margin-bottom: 10px; line-height: 1.4; height: 40px; overflow: hidden; color: #e2e8f0; }
    .prices { display: flex; align-items: baseline; gap: 8px; margin-top: auto; margin-bottom: 10px; }
    .new-price { font-size: 19px; font-weight: 800; color: #38bdf8; }
    .old-price { font-size: 13px; color: #64748b; text-decoration: line-through; }
    .view-btn { text-align: center; background: #1e293b; color: #f8fafc; padding: 7px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    .card:hover .view-btn { background: #ef4444; }

    /* تفاصيل المنتج */
    #productView { display: none; }
    .back-btn { background: none; border: none; color: #38bdf8; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 6px; }
    .product-box { background: #111827; border: 1px solid #1f2937; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    @media(min-width: 768px) { .product-box { flex-direction: row; } }
    .image-side { flex: 1; background: #fff; padding: 30px; display: flex; align-items: center; justify-content: center; }
    .image-side img { max-width: 100%; max-height: 380px; object-fit: contain; }
    .details-side { flex: 1.2; padding: 35px; display: flex; flex-direction: column; }
    .store-badge { display: inline-block; background: #1e293b; color: #38bdf8; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 800; margin-bottom: 12px; }
    .product-title { font-size: 22px; font-weight: 800; line-height: 1.5; margin-bottom: 15px; color: #fff; }
    .price-box { display: flex; align-items: baseline; gap: 15px; margin: 15px 0; }
    .new-p { font-size: 32px; font-weight: 900; color: #38bdf8; }
    .old-p { font-size: 18px; color: #64748b; text-decoration: line-through; }
    .disc-tag { background: #ef4444; color: white; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 14px; }
    .stock-box { background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; color: #f59e0b; padding: 10px 15px; border-radius: 10px; font-weight: 700; margin-bottom: 20px; }
    .description { background: #1e293b; padding: 15px; border-radius: 10px; color: #cbd5e1; font-size: 14px; line-height: 1.7; margin-bottom: 25px; }
    .buy-btn { display: block; text-align: center; background: #ef4444; color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-size: 19px; font-weight: 900; box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4); transition: 0.2s; }
    .buy-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ رادار <span>الخصومات الكبرى</span></h1>
    <div class="badge-live" id="dealsCountBadge">● جاري تحميل الصفقات...</div>
  </header>

  <div class="container">
    <div id="homeView">
      <!-- أزرار التصنيفات المنفصلة -->
      <div class="categories-bar">
        <button class="cat-btn active" data-cat="all">الكل</button>
        <button class="cat-btn" data-cat="هواتف">📱 تليفونات وهواتف</button>
        <button class="cat-btn" data-cat="أجهزة كهربائية">🔌 أجهزة كهربائية ومنزلية</button>
        <button class="cat-btn" data-cat="شاشات">📺 شاشات وتلفزيونات</button>
        <button class="cat-btn" data-cat="إلكترونيات">💻 إلكترونيات ولابتوب</button>
        <button class="cat-btn" data-cat="أحذية">👟 أحذية رياضية وكلاسيك</button>
        <button class="cat-btn" data-cat="ملابس">👕 أزياء وملابس</button>
      </div>
      <div class="deals-grid" id="dealsGrid"></div>
    </div>

    <div id="productView">
      <button class="back-btn" onclick="showHome()">→ العودة لكل العروض</button>
      <div class="product-box" id="productDetails"></div>
    </div>
  </div>

  <script src="deals.js"></script>
  <script>
    const grid = document.getElementById("dealsGrid");
    const homeView = document.getElementById("homeView");
    const productView = document.getElementById("productView");
    const productDetails = document.getElementById("productDetails");
    const catButtons = document.querySelectorAll(".cat-btn");
    const countBadge = document.getElementById("dealsCountBadge");
    let currentCategory = "all";

    function renderDeals() {
      if (typeof deals === "undefined" || !deals.length) {
        grid.innerHTML = "<p style='color:#94a3b8; text-align:center; grid-column:1/-1;'>يرجى تشغيل bot.py أولاً...</p>";
        return;
      }

      countBadge.innerText = `● تم تحميل أكثر من ${deals.length} صفقة مخفضة ومباشرة`;

      grid.innerHTML = "";
      const filtered = currentCategory === "all" ? deals : deals.filter(d => d.category === currentCategory);

      filtered.forEach(deal => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => showProduct(deal.id);
        card.innerHTML = `
          <span class="discount-tag">خصم ${deal.discount}</span>
          <span class="store-tag">${deal.store}</span>
          <img src="${deal.image}" alt="${deal.title}">
          <div class="card-body">
            <h3 class="card-title">${deal.title}</h3>
            <div class="prices">
              <span class="new-price">${deal.newPrice}</span>
              <span class="old-price">${deal.oldPrice}</span>
            </div>
            <div class="view-btn">عرض التفاصيل والكمية 🔍</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function showProduct(id) {
      const item = deals.find(d => d.id === id);
      if (!item) return;

      productDetails.innerHTML = `
        <div class="image-side">
          <img src="${item.image}" alt="${item.title}">
        </div>
        <div class="details-side">
          <div><span class="store-badge">متوفر لدى: ${item.store}</span></div>
          <h1 class="product-title">${item.title}</h1>
          <div class="price-box">
            <span class="new-p">${item.newPrice}</span>
            <span class="old-p">${item.oldPrice}</span>
            <span class="disc-tag">وفر ${item.discount}</span>
          </div>
          <div class="stock-box">
            ⏳ متبقي في مخزن العرض: ${item.stock} قطع فقط بالسعر المخفض
          </div>
          <div class="description">${item.description}</div>
          <a href="${item.productUrl}" target="_blank" rel="noopener noreferrer" class="buy-btn">
            اقتنص العرض الآن ⚡ (الشراء المباشر من ${item.store})
          </a>
        </div>
      `;

      homeView.style.display = "none";
      productView.style.display = "block";
      window.scrollTo(0, 0);
    }

    function showHome() {
      productView.style.display = "none";
      homeView.style.display = "block";
    }

    catButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        catButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.getAttribute("data-cat");
        renderDeals();
      });
    });

    renderDeals();
  </script>
</body>
</html>
