name: Auto Update Deals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper bot
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'DealsBot'
          git config --global user.email 'bot@deals.local'
          git add deals.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update deals [skip ci]" && git push)
