name: Auto Update Deals

on:
  schedule:
    - cron: '*/30 * * * *' # تشغيل السحب كل نصف ساعة
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: سحب ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المتطلبات والمتصفح
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: تشغيل الروبوت وتحديث العروض
        run: python bot.py

      - name: حفظ ملف deals.js ونشره للموقع
        run: |
          git config --global user.name 'DealsBot'
          git config --global user.email 'bot@deals.local'
          git add deals.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update deals [skip ci]" && git push)
